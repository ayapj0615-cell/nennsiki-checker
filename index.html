<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>年式チェッカー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f0f0f0;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
    header p  { font-size: 11px; opacity: 0.65; margin-top: 2px; }

    .container { max-width: 480px; margin: 0 auto; padding: 16px; }

    /* ---- 共通カード ---- */
    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .step-label {
      font-size: 11px;
      font-weight: bold;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    /* ---- STEP1 ブランド入力（タブより上、共通） ---- */
    .brand-wrap { position: relative; }

    .brand-input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .brand-input:focus { border-color: #1a1a2e; }

    /* サジェスト */
    .suggestions {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: white;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      overflow: hidden;
      max-height: 240px;
      overflow-y: auto;
    }
    .sug-item {
      padding: 12px 14px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
      line-height: 1.4;
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:active { background: #f5f5f5; }
    .sug-sub { font-size: 11px; color: #aaa; display: block; margin-top: 1px; }

    /* メルカリボタン */
    .btn-mercari {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #ff0211;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-mercari:active { opacity: 0.8; }

    /* ---- タブ ---- */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: white;
      border-radius: 14px;
      padding: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .tab {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      color: #999;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active { background: #1a1a2e; color: white; box-shadow: 0 2px 6px rgba(26,26,46,0.25); }

    /* ---- 写真モード ---- */
    .upload-area {
      background: white;
      border: 2.5px dashed #bbb;
      border-radius: 16px;
      padding: 36px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .upload-area:active { background: #f5f5f5; }
    .upload-area.has-image { border-style: solid; border-color: #1a1a2e; padding: 8px; }
    .upload-icon { font-size: 52px; margin-bottom: 10px; }
    .upload-text { font-size: 17px; font-weight: bold; color: #1a1a2e; margin-bottom: 4px; }
    .upload-sub  { font-size: 12px; color: #999; }
    #preview { width: 100%; border-radius: 10px; display: none; max-height: 320px; object-fit: contain; }
    #fileInput, #fileInput2 { display: none; }

    /* Google Lensボタン */
    .btn-lens {
      display: none;
      width: 100%;
      padding: 13px;
      background: white;
      color: #1a73e8;
      border: 2px solid #1a73e8;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-lens:active { background: #e8f0fe; }

    /* 判別ボタン */
    .btn-analyze {
      display: block;
      width: 100%;
      padding: 18px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .btn-analyze:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-analyze:active:not(:disabled) { opacity: 0.75; }

    /* ローディング */
    .loading { display: none; text-align: center; padding: 28px; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #ddd; border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 14px; color: #666; }

    /* エラー */
    .error-box {
      display: none;
      background: #fff3f3;
      border: 1px solid #f5a0a0;
      border-radius: 10px;
      padding: 12px 14px;
      color: #c0392b;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* 結果カード（共通） */
    .result-card {
      display: none;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .result-badge {
      padding: 22px 16px;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }
    .result-badge.buy      { background: #2e7d32; }
    .result-badge.consider { background: #e65100; }
    .result-badge.skip     { background: #616161; }
    .result-body { padding: 16px; }
    .result-raw {
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: #333;
      background: #fafafa;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .btn-reset {
      display: block;
      width: 100%;
      padding: 15px;
      background: white;
      color: #1a1a2e;
      border: 2px solid #1a1a2e;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-reset:active { background: #f0f0f0; }

    /* 信頼度「低」のとき：2枚目アップロードエリア */
    .low-conf-section {
      display: none;
      background: #fff8e1;
      border: 1.5px solid #ffc107;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .low-conf-msg {
      font-size: 13px;
      font-weight: bold;
      color: #5d4037;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .upload-area-2 {
      background: #fffde7;
      border: 2px dashed #ffc107;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .upload-area-2:active { background: #fff9c4; }
    .upload-area-2 .upload-icon { font-size: 36px; margin-bottom: 6px; }
    .upload-area-2 .upload-text { font-size: 14px; font-weight: bold; color: #5d4037; }
    #preview2 { width: 100%; border-radius: 8px; display: none; max-height: 200px; object-fit: contain; }

    /* ---- 手入力モード ---- */
    .brand-guide-card {
      display: none;
      background: #e8f4fd;
      border: 1.5px solid #90caf9;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .brand-guide-title { font-size: 13px; font-weight: bold; color: #1565c0; margin-bottom: 6px; }
    .brand-guide-text  { font-size: 14px; color: #1a1a2e; line-height: 1.7; }

    .code-input-section {
      display: none;
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .code-input {
      width: 100%;
      padding: 16px 14px;
      border: 2px solid #1a1a2e;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      -webkit-appearance: none;
    }

    .special-card {
      display: none;
      background: #fff8e1;
      border: 1.5px solid #ffc107;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .special-card p { font-size: 14px; color: #5d4037; line-height: 1.7; margin-bottom: 12px; }
    .btn-google {
      display: block;
      padding: 13px;
      background: #1a73e8;
      color: white;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .manual-hint {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 24px 0;
    }

    .brand-not-found {
      display: none;
      background: #fff3e0;
      border: 1.5px solid #ffb74d;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      color: #5d4037;
      margin-bottom: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <h1>🏷️ 年式チェッカー</h1>
  <p>ブランド名を入力してから写真または手入力で判別</p>
</header>

<div class="container">

  <!-- ===== STEP 1: ブランド名入力（写真・手入力の両モード共通） ===== -->
  <div class="card">
    <span class="step-label">STEP 1 ブランド名を入力（必須）</span>
    <div class="brand-wrap" id="brandWrap">
      <input
        type="text" id="brandInput" class="brand-input"
        placeholder="例：スナイデル、マックスマーラ、ユニクロ"
        oninput="onBrandInput(this.value)"
        autocomplete="off" autocorrect="off" spellcheck="false"
      >
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="btn-mercari" id="mercariBtn" onclick="openMercari()">🛍️ メルカリで検索</button>
  </div>

  <!-- ===== タブ ===== -->
  <div class="tab-bar">
    <button class="tab active" id="tabPhoto"  onclick="switchTab('photo')">📷 写真で判別</button>
    <button class="tab"        id="tabManual" onclick="switchTab('manual')">⌨️ 手入力で判別</button>
  </div>

  <!-- ===== 写真モード ===== -->
  <div id="photoPanel">

    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div id="uploadPlaceholder">
        <div class="upload-icon">📷</div>
        <div class="upload-text">STEP 2 タグ写真を撮る / 選ぶ</div>
        <div class="upload-sub">内タグ・洗濯タグ・型番タグ</div>
      </div>
      <img id="preview" alt="プレビュー">
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <button class="btn-lens" id="lensBtn" onclick="openGoogleLens()">🔍 Googleレンズで開く</button>

    <div class="error-box" id="errorBox"></div>

    <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
      年式を判別する
    </button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>タグを解析中…</p>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-badge" id="resultBadge"></div>
      <div class="result-body">
        <div class="result-raw" id="resultRaw"></div>

        <!-- 信頼度「低」のとき表示される2枚目アップロード -->
        <div class="low-conf-section" id="lowConfSection">
          <p class="low-conf-msg">📸 別の角度の写真も送ってください（型番全体が見えるもの）</p>
          <div class="upload-area-2" onclick="document.getElementById('fileInput2').click()">
            <div id="uploadPlaceholder2">
              <div class="upload-icon">📷</div>
              <div class="upload-text">2枚目の写真を撮る / 選ぶ</div>
            </div>
            <img id="preview2" alt="2枚目プレビュー">
          </div>
          <input type="file" id="fileInput2" accept="image/*" capture="environment">
        </div>

        <button class="btn-reset" onclick="resetPhoto()">🔄 最初からやり直す</button>
      </div>
    </div>

  </div>

  <!-- ===== 手入力モード ===== -->
  <div id="manualPanel" style="display:none">

    <div class="manual-hint" id="manualHint">STEP 1 のブランド名を入力するとガイドが表示されます</div>

    <div class="brand-not-found" id="brandNotFound">
      ⚠️ このブランドは手入力モード非対応です。<br>写真モードでAIに判別させてください。
    </div>

    <!-- ガイド表示 -->
    <div class="brand-guide-card" id="brandGuideCard">
      <div class="brand-guide-title" id="guideBrandName"></div>
      <div class="brand-guide-text"  id="guideText"></div>
    </div>

    <!-- 特殊ブランド（クリステンセンドゥノルドなど） -->
    <div class="special-card" id="specialCard">
      <p id="specialText"></p>
      <a id="googleSearchLink" href="#" target="_blank" class="btn-google">🔍 Googleで型番を検索する</a>
    </div>

    <!-- コード入力 -->
    <div class="code-input-section" id="codeInputSection">
      <span class="step-label">STEP 2 タグの値を入力（即座に変換）</span>
      <input
        type="text" id="codeInput" class="code-input"
        oninput="onCodeInput(this.value)"
        autocomplete="off" autocorrect="off" spellcheck="false" maxlength="10"
      >
    </div>

    <!-- 手入力結果 -->
    <div class="result-card" id="manualResultCard">
      <div class="result-badge" id="manualResultBadge"></div>
      <div class="result-body">
        <div class="result-raw" id="manualResultRaw"></div>
        <button class="btn-reset" onclick="resetManual()">🔄 別のブランドを検索</button>
      </div>
    </div>

  </div>

</div><!-- /container -->

<script>
// =============================================
// ブランドデータ（61社）
// =============================================
function d1(v) {
  const m = {'0':2020,'1':2021,'2':2022,'3':2023,'4':2024,'5':2025,'6':2026,'7':2027,'8':2018,'9':2019};
  return m[String(v).trim()] || null;
}
function d2(v) {
  const n = parseInt(String(v).trim());
  return (n >= 15 && n <= 50) ? 2000 + n : null;
}
function fy(year) {
  if (!year) return null;
  const j = year >= 2023 ? 'buy' : year >= 2017 ? 'consider' : 'skip';
  return { year: year + '年', yearNum: year, judgment: j };
}

const BRANDS = [
  { id:1, main:'オンワード樫山', subs:['ニジュウサンク','クミキョク','ジユウク','ベイジ','アンフィーロ','アイシービー','トッカ','ジェイプレス','ポールスミスレディース','ジョゼフ','エイトン'],
    guide:'型番のアルファベット1文字を入力\nH=2017 Y=2018 K=2019 B=2020 I=2021 N=2022 S=2023 C=2024 G=2025 L=2026（10年周期）', placeholder:'G',
    convert(v){const m={H:2017,Y:2018,K:2019,B:2020,I:2021,N:2022,S:2023,C:2024,G:2025,L:2026};return fy(m[v.trim().toUpperCase()]||null);}},
  { id:2, main:'ファーイーストカンパニー', subs:['アナイ','アルアバイル','ルルウィルビー'],
    guide:'型番の左から3,4桁目の数字2桁を入力\n例：25 → 2025年', placeholder:'25',
    convert(v){return fy(d2(v));}},
  { id:3, main:'フォクシー', subs:['フォクシーニューヨーク','アディアム','ベロアノワール','フォクシースポーツ'],
    guide:'型番（数字5桁）の左から1,2桁目を入力\n37=2017〜 46=2026（以降継続）', placeholder:'45',
    convert(v){const n=parseInt(v.trim());return(n>=37&&n<=60)?fy(2000+(n-20)):null;}},
  { id:4, main:'フィルム', subs:['ダブルスタンダードクロージング','ソブ','ディーヒム'],
    guide:'型番の左から8,9桁目の数字を入力\n例：25 → 2025年', placeholder:'25',
    convert(v){return fy(d2(v));}},
  { id:5, main:'ARTS&SCIENCE', subs:[],
    guide:'2020SS以前：2桁目1文字を入力（7=2017 8=2018 9=2019 0=2020SS）\n2020AW以降：2,3桁目の2桁を入力（20=2020AW 25=2025）', placeholder:'25',
    convert(v){v=v.trim();if(v.length===1){const m={'7':2017,'8':2018,'9':2019,'0':2020};const yr=m[v];return yr?{...fy(yr),year:yr+(yr===2020?'年 春夏':'年')}:null;}const yr=d2(v);return yr?{...fy(yr),year:yr+'年 秋冬以降'}:null;}},
  { id:6, main:'エムズグレイシー', subs:[],
    guide:'型番のハイフン右側1桁目を入力\n※洗濯マークも確認して年代を区別してください', placeholder:'5',
    convert(v){return fy(d1(v));}},
  { id:7, main:'モンクレール', subs:[],
    guide:'型番の先頭アルファベット1文字を入力\nC=2017 D=2018 E=2019 F=2020 G=2021 H=2022 I=2023 J=2024 K=2025 L=2026\nDIND-表記なら続く2桁の数字を入力（25=2025）', placeholder:'K',
    convert(v){v=v.trim().toUpperCase();const lm={C:2017,D:2018,E:2019,F:2020,G:2021,H:2022,I:2023,J:2024,K:2025,L:2026};if(lm[v])return fy(lm[v]);const n=parseInt(v);return(n>=21&&n<=40)?fy(2000+n):null;}},
  { id:8, main:'TATRAS', subs:[],
    guide:'型番の5,6桁目の数字を入力\n例：25 → 2025年', placeholder:'25',
    convert(v){return fy(d2(v));}},
  { id:9, main:'BIGI', subs:['ビギ','ヨシエイナバ'],
    guide:'型番の左から4番目の数字を入力\n例：5=2025 6=2026', placeholder:'5',
    convert(v){return fy(d1(v));}},
  { id:10, main:'メルローズ', subs:['ピンクハウス','ティアラ'],
    guide:'型番の左から4番目の数字を入力\n例：5=2025 6=2026', placeholder:'5',
    convert(v){return fy(d1(v));}},
  { id:11, main:'ラルフローレン', subs:['ローレンラルフローレン','ポロラルフローレン'],
    guide:'QRコードをスキャン → HP → more detail → date の日付を入力\nQRなしの場合は洗濯マークの年代を目視確認', placeholder:'2025-08-01',
    convert(v){const m=v.match(/(\d{4})/);if(m)return{...fy(parseInt(m[1])),year:v+'（製造日）'};return{year:v+'（参考）',yearNum:null,judgment:'consider'};}},
  { id:12, main:'ルネ', subs:[],
    guide:'型番の左から2番目の数字を入力\n例：5=2025 6=2026', placeholder:'5',
    convert(v){return fy(d1(v));}},
  { id:13, main:'ヘルノ', subs:[],
    guide:'EACタグに記載の発売日（月/年形式）を入力\n例：03/2025', placeholder:'03/2025',
    convert(v){const m=v.match(/(\d{4})/);return m?{...fy(parseInt(m[1])),year:v+'（発売日）'}:null;}},
  { id:14, main:'ワールド', subs:['クードシャンス','ドレステリア','リフレクト','インディヴィ','アンタイトル','タケオキクチ'],
    guide:'型番のハイフン横2番目の数字を入力\n2=2025SS 3=2025AW 4=2026SS 6=2023SS 7=2023AW 8=2024SS 9=2024AW', placeholder:'9',
    convert(v){const map={'2':{l:'2025SS',y:2025},'3':{l:'2025AW',y:2025},'4':{l:'2026SS または 2022SS',y:2026,note:'洗濯マークで年代を区別してください'},'5':{l:'2022AW',y:2022},'6':{l:'2023SS',y:2023},'7':{l:'2023AW',y:2023},'8':{l:'2024SS',y:2024},'9':{l:'2024AW',y:2024}};const e=map[v.trim()];return e?{year:e.l+'年',yearNum:e.y,judgment:e.y>=2023?'buy':'consider',note:e.note||''}:null;}},
  { id:15, main:'東京ソワール', subs:[],
    guide:'型番の末尾2桁を入力\n例：25 → 2025年', placeholder:'25',
    convert(v){return fy(d2(v));}},
  { id:16, main:'ボウルズ', subs:['ハイク'],
    guide:'型番の左から1,2桁目を入力\n例：25 → 2025年', placeholder:'25',

const BRAND_INDEX = [];
BRANDS.forEach(b => {
  BRAND_INDEX.push({ name: b.main, parent: null, brand: b });
  b.subs.forEach(s => BRAND_INDEX.push({ name: s, parent: b.main, brand: b }));
});

// 状態変数
// =============================================
let imageData = null, imageType = null;

// =============================================
// ブランド入力（共通）
// =============================================
function onBrandInput(val) {
  const trimmed = val.trim();

  // メルカリボタン
  document.getElementById('mercariBtn').style.display = trimmed ? 'block' : 'none';

  // 写真モード判別ボタン更新
  updateAnalyzeBtn();

  // ブランド選択：完全一致で自動セット
  selectedBrand = null;
  if (trimmed) {
    const tl = trimmed.toLowerCase();
    const exact = BRAND_INDEX.find(i => i.name.toLowerCase() === tl);
    if (exact) selectedBrand = exact.brand;
  }

  // サジェスト表示
  showSuggestions(val);

  // 手入力モードのパネル更新
  if (currentTab === 'manual') updateManualPanel();

  // ブランドが変わったら手入力結果・コードリセット
  document.getElementById('manualResultCard').style.display = 'none';
  document.getElementById('codeInput').value = '';
}

function showSuggestions(val) {
  const sugEl = document.getElementById('suggestions');
  const q = val.trim().toLowerCase();
  if (!q) { sugEl.style.display = 'none'; sugEl.innerHTML = ''; return; }

  const hits = BRAND_INDEX.filter(i => i.name.toLowerCase().includes(q)).slice(0, 8);
  if (!hits.length) { sugEl.style.display = 'none'; sugEl.innerHTML = ''; return; }

  sugEl.innerHTML = hits.map((item, i) =>
    `<div class="sug-item" data-i="${i}">
      ${item.name}
      ${item.parent ? `<span class="sug-sub">→ ${item.parent}</span>` : ''}
    </div>`
  ).join('');

  sugEl.querySelectorAll('.sug-item').forEach((el, i) => {
    const pick = (e) => { e.preventDefault(); e.stopPropagation(); selectBrand(hits[i]); };
    el.addEventListener('mousedown', pick);
    el.addEventListener('touchend',  pick);
  });

  sugEl.style.display = 'block';
}

function selectBrand(item) {
  selectedBrand = item.brand;
  document.getElementById('brandInput').value = item.name;
  document.getElementById('mercariBtn').style.display = 'block';
  document.getElementById('suggestions').style.display = 'none';
  document.getElementById('suggestions').innerHTML = '';
  updateAnalyzeBtn();
  document.getElementById('manualResultCard').style.display = 'none';
  document.getElementById('codeInput').value = '';
  if (currentTab === 'manual') updateManualPanel();
}

function openMercari() {
  const brand = document.getElementById('brandInput').value.trim();
  if (brand) window.open('https://mercari.com/search/?keyword=' + encodeURIComponent(brand), '_blank');
}

  const file = e.target.files[0];

  originalFile = file;
  resizeAndConvert(file, function(b64, mime) {
    imageData = b64; imageType = mime;
    document.getElementById('preview').src = 'data:' + mime + ';base64,' + b64;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('uploadPlaceholder').style.display = 'none';
    document.getElementById('uploadArea').classList.add('has-image');

    hideError();

});

document.getElementById('fileInput2').addEventListener('change', function(e) {

  resizeAndConvert(file, function(b64, mime) {

  });

function resizeAndConvert(file, cb) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const url = canvas.toDataURL('image/jpeg', 0.88);
      cb(url.split(',')[1], 'image/jpeg');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function updateAnalyzeBtn() {
  const hasBrand = document.getElementById('brandInput').value.trim().length > 0;
  document.getElementById('analyzeBtn').disabled = !(imageData && hasBrand);
}

async function analyze() {
  if (!imageData) return;
  hideError();
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';

  try {
    const body = {
      imageData,
      mediaType: imageType,
      brandName: document.getElementById('brandInput').value.trim(),
    };
    if (imageData2) { body.imageData2 = imageData2; body.mediaType2 = imageType2; }

    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '判定に失敗しました');
    showPhotoResult(data);
  } catch (err) {
    showError(err.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
    updateAnalyzeBtn();
  }
}

function showPhotoResult(data) {
  const card  = document.getElementById('resultCard');
  const badge = document.getElementById('resultBadge');
  const raw   = document.getElementById('resultRaw');

  badge.className = 'result-badge ' + data.judgment;
  badge.textContent = data.judgment === 'buy' ? '✅ 仕入れ推奨' : data.judgment === 'consider' ? '🔶 要検討' : '⛔ スルー推奨';
  raw.textContent = data.result;

  // 信頼度「低」かつ2枚目未提出なら追加撮影エリアを表示
  const lowConf = document.getElementById('lowConfSection');
  lowConf.style.display = (data.isLowConfidence && !imageData2) ? 'block' : 'none';

  card.style.display = 'block';
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function resetPhoto() {
  imageData = null; imageType = null;
  imageData2 = null; imageType2 = null;
  originalFile = null;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('preview').src = '';
  document.getElementById('uploadPlaceholder').style.display = 'block';
  document.getElementById('uploadArea').classList.remove('has-image');
  document.getElementById('lensBtn').style.display = 'none';
  document.getElementById('preview2').style.display = 'none';
  document.getElementById('preview2').src = '';
  document.getElementById('uploadPlaceholder2').style.display = 'block';
  document.getElementById('lowConfSection').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('fileInput').value = '';
  document.getElementById('fileInput2').value = '';
  updateAnalyzeBtn();
  hideError();
}

function openGoogleLens() {
  if (originalFile && navigator.canShare && navigator.canShare({ files: [originalFile] })) {
    navigator.share({ files: [originalFile], title: '年式チェッカー' })
      .catch(() => window.open('https://lens.google.com/', '_blank'));
  } else {
    window.open('https://lens.google.com/', '_blank');
  }
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.textContent = '⚠️ ' + msg;
  b.style.display = 'block';
}
function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

// =============================================
// 手入力モード
// =============================================
function updateManualPanel() {
  const hint      = document.getElementById('manualHint');
  const notFound  = document.getElementById('brandNotFound');
  const guideCard = document.getElementById('brandGuideCard');
  const special   = document.getElementById('specialCard');
  const codeSection = document.getElementById('codeInputSection');
  const brandVal  = document.getElementById('brandInput').value.trim();

  if (!brandVal) {
    hint.style.display = 'block';
    notFound.style.display = 'none';
    guideCard.style.display = 'none';
    special.style.display = 'none';
    codeSection.style.display = 'none';
    return;
  }

  hint.style.display = 'none';

  if (!selectedBrand) {
    notFound.style.display = 'block';
    guideCard.style.display = 'none';
    special.style.display = 'none';
    codeSection.style.display = 'none';
    return;
  }

  notFound.style.display = 'none';

  // ガイド表示
  document.getElementById('guideBrandName').textContent = '📖 ' + selectedBrand.main;
  document.getElementById('guideText').textContent = selectedBrand.guide;
  guideCard.style.display = 'block';

  if (selectedBrand.isSpecial) {
    codeSection.style.display = 'none';
    document.getElementById('specialText').textContent = selectedBrand.guide;
    document.getElementById('googleSearchLink').href =
      'https://www.google.com/search?q=' + encodeURIComponent(selectedBrand.main + ' 型番 年式');
    special.style.display = 'block';
  } else {
    special.style.display = 'none';
    document.getElementById('codeInput').placeholder = selectedBrand.placeholder || '';
    codeSection.style.display = 'block';
    setTimeout(() => document.getElementById('codeInput').focus(), 150);
  }
}

function onCodeInput(val) {
  if (!selectedBrand || !val.trim()) {
    document.getElementById('manualResultCard').style.display = 'none';
    return;
  }
  showManualResult(selectedBrand.convert(val), val);
}

function showManualResult(result, inputVal) {
  const card  = document.getElementById('manualResultCard');
  const badge = document.getElementById('manualResultBadge');
  const raw   = document.getElementById('manualResultRaw');

  if (!result) {
    badge.className = 'result-badge skip';
    badge.textContent = '⛔ 判別不可';
    raw.textContent = '入力値「' + inputVal + '」を変換できませんでした。\nタグの値を再確認してください。';
    card.style.display = 'block';
    return;
  }

  const yr = result.yearNum;
  let bc, bt, jt;
  if (!yr || result.judgment === 'unknown') {
    bc='consider'; bt='🔶 要確認'; jt='年式：'+result.year;
  } else if (yr >= 2023) {
    bc='buy';     bt='✅ 仕入れ推奨'; jt='年式：'+result.year+'\n判定：高優先度（2023年以降）';
  } else if (yr >= 2020) {
    bc='consider'; bt='🔶 積極的に仕入れ検討'; jt='年式：'+result.year+'\n判定：積極的に仕入れ検討（2020年以降）';
  } else if (yr >= 2017) {
    bc='consider'; bt='🔶 要検討'; jt='年式：'+result.year+'\n判定：検討対象（2017年以降）';
  } else {
    bc='skip';    bt='⛔ スルー推奨'; jt='年式：'+result.year+'\n判定：古すぎる可能性あり';
  }
  if (result.note) jt += '\n\n⚠️ ' + result.note;

  badge.className = 'result-badge ' + bc;
  badge.textContent = bt;
  raw.textContent = jt;
  card.style.display = 'block';
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function resetManual() {
  document.getElementById('codeInput').value = '';
  document.getElementById('manualResultCard').style.display = 'none';
  document.getElementById('brandInput').value = '';
  document.getElementById('mercariBtn').style.display = 'none';
  selectedBrand = null;
  updateManualPanel();
  updateAnalyzeBtn();
  document.getElementById('brandInput').focus();
}
</script>
